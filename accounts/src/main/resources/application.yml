spring:
  # Unique application name used by Config Server to locate configuration files
  application:
    name: accounts
  # Active profile determines which environment-specific configuration to load
  # (can be passed through Program Arguments or Environment Variables when Docker/Kubernetes is used)
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:13306/accountsdb
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
  # Import configuration from the Config Server during application startup
  config:
    import: "optional:configserver:http://localhost:8071/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
        
server:
  port: 8080

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "accounts"
    description: "SammoBank Accounts Application"
    version: "1.0.0"

logging:
  level:
    com:
      sammo:
        accounts: DEBUG