spring:
  # Unique application name used by Config Server to locate configuration files
  application:
    name: accounts
  # Active profile determines which environment-specific configuration to load
  # (can be passed through Program Arguments or Environment Variables when Docker/Kubernetes is used)
  profiles:
    active: prod
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassname: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  # Import configuration from the Config Server during application startup
  config:
    import: "optional:configserver:http://localhost:8071/"

server:
  port: 8080
