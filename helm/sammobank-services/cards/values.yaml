deploymentName: cards-deployment
serviceName: cards
appLabel: cards
appName: cards

replicaCount: 1

image:
  repository: soyachunkz/cards
  tag: latest

containerPort: 9000

service:
  type: ClusterIP
  port: 9000
  targetPort: 9000

appname_enabled: true
profile_enabled: true
config_enabled: true
eureka_enabled: true
resourceserver_enabled: false
database_enabled: true
otel_enabled: true
kafka_enabled: true
mail_credentials_enabled: false

database:
  configMapKey: CARDS_DATASOURCE_URL
  usernameConfigMapKey: CARDS_DATASOURCE_USERNAME
  passwordConfigMapKey: CARDS_DATASOURCE_PASSWORD