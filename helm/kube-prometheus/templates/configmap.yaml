apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-prometheus.fullname" . }}
  labels:
    {{ include "kube-prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval }}

    scrape_configs:
      - job_name: 'accounts'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['accounts.default.svc.cluster.local:8080']
      - job_name: 'loans'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['loans.default.svc.cluster.local:8090']
      - job_name: 'cards'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['cards.default.svc.cluster.local:9000']
      - job_name: 'gatewayserver'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['gatewayserver.default.svc.cluster.local:9090']
      - job_name: 'eurekaserver'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['eurekaserver.default.svc.cluster.local:8070']
      - job_name: 'configserver'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['configserver.default.svc.cluster.local:8071']

      - job_name: 'mysql'
        metrics_path: /probe
        static_configs:
          - targets:
              - accountsdb.default.svc.cluster.local:3306
              - loansdb.default.svc.cluster.local:3306
              - cardsdb.default.svc.cluster.local:3306

        relabel_configs:
          - source_labels: [ __address__ ]
            target_label: __param_target

          - source_labels: [ __param_target ]
            target_label: instance

          - target_label: __address__
            replacement: mysql-exporter.default.svc.cluster.local:9104