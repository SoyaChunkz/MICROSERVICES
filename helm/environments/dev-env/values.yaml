global:
  configMapName: sammobankdev-configmap

  activeProfile: default

  configServerURL: "configserver:http://configserver:8071/"

  eurekaServerURL: "http://eurekaserver:8070/eureka/"

  keyCloakURL: "http://keycloak.default.svc.cluster.local:8180/realms/sammobank/protocol/openid-connect/certs"

  openTelemetryJavaAgent: "-javaagent:/app/libs/opentelemetry-javaagent-2.22.0.jar"

  otelExporterEndPoint: "http://tempo.default.svc.cluster.local:4318"

  otelMetricsExporter: "none"

  otelLogsExporter: "none"

  kafkaBrokerURL: "kafka-controller-0.kafka-controller-headless.default.svc.cluster.local:9092"

  accountsDatasourceURL: "jdbc:mysql://accountsdb:3306/accountsdb"
  accountsDatasourceUsername: "root"
  accountsDatasourcePassword: "root"

  loansDatasourceURL: "jdbc:mysql://loansdb:3306/loansdb"
  loansDatasourceUsername: "root"
  loansDatasourcePassword: "root"

  cardsDatasourceURL: "jdbc:mysql://cardsdb:3306/cardsdb"
  cardsDatasourceUsername: "root"
  cardsDatasourcePassword: "root"