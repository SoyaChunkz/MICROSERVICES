spring:
  application:
    name: gatewayserver
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lowerCaseServiceId: true
      httpclient:
        connect-timeout: 1000
        response-timeout: 10s
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri tells the Gateway where to fetch Keycloak's public keys, which Spring Security then uses to verify the JWT's signature.
          # The public key is needed to determine whether the token was actually signed by Keycloak and hasn't been tampered with.
          jwk-set-uri: "http://localhost:8180/realms/sammobank/protocol/openid-connect/certs"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: "gatewayserver"
    description: "SammoBank Gateway Server Application"
    version: "1.0.0"

logging:
  level:
    com:
      sammo:
        gatewayserver: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10 # Resilience4j looks at the last 10 calls when calculating the failure rate.
      failureRateThreshold: 50 # If the failure rate reaches 50%, the circuit can transition to OPEN.
      waitDurationInOpenState: 10000 # During these 10 seconds, calls are rejected by the circuit before allowing a transition to HALF-OPEN.
      permittedNumberOfCallsInHalfOpenState: 2 # When the 10 seconds are over, the circuit becomes: HALF-OPEN, it will allow 2 test calls to check whether the service has recovered.
